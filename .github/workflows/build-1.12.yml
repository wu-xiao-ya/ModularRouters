name: Build Minecraft 1.12.2

on:
  push:
    branches:
      - MC1.12-master
      - codex/fix-1.12-dynamic-item-handler-slots
  pull_request:
    branches:
      - MC1.12-master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean test build --no-daemon --stacktrace
        env:
          BUILD_NUMBER: gh${{ github.run_number }}

      - name: Upload Modular Routers JAR
        uses: actions/upload-artifact@v4
        with:
          name: modular-routers-1.12.2-${{ github.run_number }}
          path: |
            build/libs/modular-routers-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
